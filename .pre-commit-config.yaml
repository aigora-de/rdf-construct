# See https://pre-commit.com for more information
# Install: pip install pre-commit
# Setup: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: [--strict]

  # Size guard for the instruction/memory surface (#73). Runs only when the
  # tracked half changes; the memory store itself is local, so the script warns
  # rather than fails when it is absent.
  - repo: local
    hooks:
      - id: memory-budget
        name: instruction/memory surface size guard
        entry: scripts/check-memory-budget.sh
        language: script
        pass_filenames: false
        files: ^(CLAUDE\.md|docs/dev/EXPERTS\.md)$
