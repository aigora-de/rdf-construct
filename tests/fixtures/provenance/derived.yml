# Profiles for tests/fixtures/provenance/derived.ttl (#90, #280).

profiles:
  # Lossless: every subject claimed, so the output is the source reordered and nothing is stamped.
  full:
    sections:
      - header: {}
      - classes: {sort: topological}
      - obj_props: {}
      - data_props: {}
      - individuals: {}

  # #280's reproducer: classes alone, filtering deliberately.
  classes_ignore:
    unclaimed: ignore
    sections:
      - header: {}
      - classes: {sort: alpha}

  # The same extract under the default `warn`: the trigger is what was written, not the policy.
  classes_warn:
    sections:
      - header: {}
      - classes: {sort: alpha}

  # `individuals` after `classes`: it takes every subject the earlier sections left.
  classes_then_individuals:
    unclaimed: ignore
    sections:
      - header: {}
      - classes: {sort: alpha}
      - individuals: {}

  # Lossless, with no header section: the header still leads the file.
  no_header_section:
    sections:
      - classes: {sort: topological}
      - obj_props: {}
      - data_props: {}
      - individuals: {}

  # A header section placed later still decides where the header goes.
  header_late:
    sections:
      - classes: {sort: topological}
      - header: {}
      - obj_props: {}
      - data_props: {}
      - individuals: {}

  # The explicit opt-out: everything but the header.
  omit_header:
    header: false
    sections:
      - classes: {sort: topological}
      - obj_props: {}
      - data_props: {}
      - individuals: {}
