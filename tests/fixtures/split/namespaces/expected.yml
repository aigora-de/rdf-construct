# Written by hand (#177). For each source: every module file `split --by-namespace` must write, and
# the named subjects it holds, ignoring the module's own owl:Ontology header (#178's). `prefixes`
# lists, where given, exactly the prefixes a module file declares.

empty.ttl:
  modules: {}

phantoms.ttl:
  modules:
    ex.ttl:
      - http://example.org/phantoms#Widget
      - http://example.org/phantoms#partOf

org_collision.ttl:
  modules:
    org.ttl:
      - http://example.org/org#Team
      - http://example.org/org#headcount
  prefixes:
    org.ttl: [org, owl, rdfs, xsd]

nested.ttl:
  modules:
    env.ttl:
      - http://example.org/ies/env/EnvironmentalThing
      - http://example.org/ies/env/x/Y
    building.ttl:
      - http://example.org/ies/env/building/Building
      - http://example.org/ies/env/building/hasStorey
    blg-class.ttl:
      - http://example.org/ies/env/building-classification/ClassOfDetachedHouse
      - http://example.org/ies/env/building-classification/ClassOfTerrace

fallback.nt:
  modules:
    ontology.ttl:
      - http://example.org/ontology#Thing
    org.ttl:
      - http://example.org/ontology/org#Team
    vocab.ttl:
      - http://example.org/vocab/memberOf
    codes.ttl:
      - urn:example:codes:Red

common_prefix.ttl:
  modules:
    common.ttl:
      - http://example.org/shared#Shared
    other.ttl:
      - http://example.org/other#Other

suffixes.ttl:
  modules:
    org.ttl:
      - http://example.org/mine#Mine
    org-2.ttl:
      - http://example.org/org#Theirs
    ex.ttl:
      - http://example.org/lower#Lower
    Ex-2.ttl:
      - http://example.org/upper#Upper
    thing.ttl:
      - http://a.example/thing#A
    thing-2.ttl:
      - http://b.example/thing#B

empty_prefix.ttl:
  modules:
    ontology.ttl:
      - http://example.org/ontology#Thing
      - http://example.org/ontology#relatesTo
