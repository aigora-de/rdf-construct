# SHACL Generator Configuration
# ==============================
#
# This file configures how SHACL shapes are generated from OWL ontologies.
# Use with: rdf-construct shacl-gen ontology.ttl --config shacl-config.yml

# Strictness level controls which OWL patterns are converted:
#   minimal  - Basic type constraints only (sh:class, sh:datatype)
#   standard - Adds cardinality, functional property and enumeration (sh:in)
#              constraints (default)
#   strict   - Currently the same as standard
level: standard

# sh:severity for every node and property shape. Omit it to write none, which SHACL
# reads as violation. Any result, whatever its severity, means the data does not
# conform; the severity labels the result, and a processor may let you filter on it.
#   violation | warning | info
# default_severity: warning

# Generate closed shapes (sh:closed true), at any level
# When true, an instance may carry only rdf:type, ignored_properties, and the
# properties its class's hierarchy declares (superclasses and subclasses)
closed: false

# Namespace for generated shapes: a full IRI ending in '#', '/' or ':'.
# Omit it to derive one: the ontology IRI + "-shapes#"
# shape_namespace: "http://example.org/my-shapes#"

# Target specific classes only (leave empty for all classes)
# Use local names or full URIs
target_classes: []
  # - Building
  # - Floor
  # - http://example.org/Person

# Exclude specific classes from shape generation
exclude_classes: []
  # - owl:Thing
  # - rdfs:Resource

# Include rdfs:label as sh:name in shapes
include_labels: true

# Include rdfs:comment as sh:description in shapes
include_descriptions: true

# Inherit property constraints from superclasses
# When true, subclass shapes include constraints from parent classes
inherit_constraints: true

# Properties to ignore in closed shapes
# These properties are allowed even when sh:closed is true
ignored_properties:
  - rdf:type
  - rdfs:label
  - rdfs:comment
  # - dcterms:created
  # - dcterms:modified
